services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: inspot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inspot
      POSTGRES_PASSWORD: inspot_dev_password
      POSTGRES_DB: inspot_dev
    ports:
      - "5432:5432"
    volumes:
      - inspot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspot -d inspot_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inspot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - inspot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  inspot_postgres_data:
  inspot_redis_data:
